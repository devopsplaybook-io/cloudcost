name: Main Build

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  merge-build:
    uses: devopsplaybook-io/common-utils/.github/workflows/reusable-merge-build.yml@f132584acb5d712c571012e7dfbbeba6a92efe93
    with:
      node_app_directories: '["cloudcost-server"]'
      docker_platforms: "linux/amd64"
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      QUALITY_DASHBOARD_URL: ${{ secrets.QUALITY_DASHBOARD_URL }}
      QUALITY_DASHBOARD_TOKEN: ${{ secrets.QUALITY_DASHBOARD_TOKEN }}
